name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Permite ejecución manual desde GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Generate icons
      run: npm run generate-icons
      
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Grant execute permission for gradlew
      run: chmod +x android/gradlew
      
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Sync Capacitor
      run: npx cap sync android
      
    - name: Generate Android icons
      run: node scripts/generate-android-icons.js
      
    - name: Build Debug APK
      run: |
        cd android
        ./gradlew assembleDebug
        
    - name: Build Release APK (Unsigned)
      run: |
        cd android
        ./gradlew assembleRelease
        
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: exit-trading-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
        
    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: exit-trading-release-apk
        path: android/app/build/outputs/apk/release/app-release-unsigned.apk
        retention-days: 30
        
    - name: Generate APK info
      run: |
        echo "## 📱 APK Generado Exit Trading" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📦 Archivos generados:" >> $GITHUB_STEP_SUMMARY
        echo "- **Debug APK**: Disponible en artifacts" >> $GITHUB_STEP_SUMMARY
        echo "- **Release APK**: Disponible en artifacts" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📥 Cómo obtener el APK:" >> $GITHUB_STEP_SUMMARY
        echo "1. Ve a la pestaña 'Actions' de este repositorio" >> $GITHUB_STEP_SUMMARY
        echo "2. Selecciona el workflow más reciente" >> $GITHUB_STEP_SUMMARY
        echo "3. Descarga el APK deseado desde 'Artifacts'" >> $GITHUB_STEP_SUMMARY